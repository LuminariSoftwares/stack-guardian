[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-guardian"
version = "0.1.0.dev0"
description = "A health doctor for a home AI stack: Ollama nodes, GPUs, tailnet and harness logs, with graded confidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LuminariSoftwares" }]
dependencies = []

[project.scripts]
stack-guardian = "stack_guardian.cli:main"
stack-guardian-mcp = "stack_guardian.mcp_server:main"
stack-guardian-serve = "stack_guardian.serve:main"

[tool.setuptools]
packages = ["stack_guardian"]
