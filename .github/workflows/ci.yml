name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py3.11)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q

  dsh-plugin:
    name: DSH plugin syntax (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check dsh/index.js

  wheel:
    name: built wheel works (no editable install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python -m pip install build && python -m build --outdir dist .
      - name: Install the wheel in a clean venv and run the example snapshot
        run: |
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install dist/*.whl
          cd /tmp
          set +e
          /tmp/wv/bin/stack-guardian doctor --snapshot "$GITHUB_WORKSPACE/examples/snapshot.json" --ctx "$GITHUB_WORKSPACE/examples/ctx.json" --state /tmp/wv-state.json --json > /tmp/report.json
          rc=$?
          set -e
          echo "doctor exit code: $rc"
          python -c "import json;f=json.load(open('/tmp/report.json'));codes=sorted({x['code'] for x in (f if isinstance(f,list) else f.get('findings',[]))});print(len(codes),'codes:',codes);assert len(codes)>=8,codes"
