name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the package declares; ubuntu also covers the newer interpreters people actually have.
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: windows-latest, python: "3.11"}
          - {os: macos-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  dsh-plugin:
    name: DSH plugin syntax (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: node --check dsh/index.js

  wheel:
    name: built wheel works (no editable install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build
        run: python -m pip install build && python -m build --outdir dist .
      - name: The PyPI description carries the MCP Registry marker
        run: |
          python -c "import glob,zipfile;w=glob.glob('dist/*.whl')[0];m=zipfile.ZipFile(w).read([n for n in zipfile.ZipFile(w).namelist() if n.endswith('/METADATA')][0]).decode();assert 'mcp-name: io.github.LuminariSoftwares/stack-guardian' in m.splitlines(),'marker missing from wheel METADATA';print('marker present in',w)"
      - name: Install the wheel in a clean venv and run the example snapshot
        run: |
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install dist/*.whl
          cd /tmp
          set +e
          /tmp/wv/bin/stack-guardian doctor --snapshot "$GITHUB_WORKSPACE/examples/snapshot.json" --ctx "$GITHUB_WORKSPACE/examples/ctx.json" --state /tmp/wv-state.json --json > /tmp/report.json
          rc=$?
          set -e
          echo "doctor exit code: $rc"
          python -c "import json;f=json.load(open('/tmp/report.json'));codes=sorted({x['code'] for x in (f if isinstance(f,list) else f.get('findings',[]))});print(len(codes),'codes:',codes);assert len(codes)>=8,codes"

  docker:
    name: Docker image lists its MCP tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: docker build -t stack-guardian .
      - name: initialize + tools/list over stdio
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm stack-guardian > /tmp/replies.jsonl
          python3 -c "import json;r=[json.loads(l) for l in open('/tmp/replies.jsonl')];names=[t['name'] for t in r[1]['result']['tools']];print(names);assert names==['stack_health','stack_snapshot','stack_explain'],names"
